name: Godot smoke checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build lightweight Godot engine image (no export templates)
        run: docker build --target engine -t grandsea-smoke-engine .
      - name: Fetch compact CC0 character models
        run: bash tools/fetch_models.sh
      - name: Import project and register GDScript classes
        run: docker run --rm -v "$PWD:/game" -w /game grandsea-smoke-engine godot --headless --editor --path /game --import
      - name: Run procedural island and HUD smoke test
        run: timeout -k 3s 22s docker run --rm -v "$PWD:/game" -w /game grandsea-smoke-engine godot --headless --path /game --script res://tools/smoke.gd
      - name: Check coastline collision, swimming, pirate spawns
        run: timeout -k 3s 25s docker run --rm -v "$PWD:/game" -w /game grandsea-smoke-engine godot --headless --path /game --script res://tools/gameplay_test.gd
      - name: Combat timing and directional hit validation
        run: timeout -k 3s 25s docker run --rm -v "$PWD:/game" -w /game grandsea-smoke-engine godot --headless --path /game --script res://tools/combat_test.gd
      - name: Validate land/ocean, walls, firing and character facing
        run: timeout -k 3s 45s docker run --rm -v "$PWD:/game" -w /game grandsea-smoke-engine godot --headless --path /game --script res://tools/world_integrity_test.gd
      - name: Boot multiplayer dedicated server
        run: docker run --rm -v "$PWD:/game" -w /game grandsea-smoke-engine godot --headless --path /game --quit-after 5 -- --server
